# =====================================================
# Nginx Optimization Config for CTC Website
# Save to: /etc/nginx/conf.d/ctcdn-perf.conf
# or include inside your server {} block
# =====================================================

# --- Gzip compression ---
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_types
    text/plain text/css text/xml text/javascript
    application/json application/javascript application/xml
    application/rss+xml application/atom+xml
    image/svg+xml font/woff2;

# --- Brotli compression (nếu có nginx-brotli module) ---
# brotli on;
# brotli_comp_level 6;
# brotli_types text/plain text/css application/json application/javascript image/svg+xml;

# =====================================================
# Vite Build Assets: Cache 1 year (content-hashed filenames)
# =====================================================
location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header Vary "Accept-Encoding";
    access_log off;

    # Serve WebP automatically if browser supports and .webp exists
    # (optional - only if you use the try_files approach)
    # try_files $uri $uri/ =404;
}

# =====================================================
# Static files (favicon, manifest, robots, sitemap)
# =====================================================
location ~* \.(ico|svg|webmanifest|xml|txt)$ {
    expires 7d;
    add_header Cache-Control "public";
    access_log off;
}

# =====================================================
# Upload images: Cache 30 days + Serve WebP if supported
# =====================================================
location /uploads/ {
    expires 30d;
    add_header Cache-Control "public";
    add_header Vary "Accept";

    # Auto-serve .webp if browser supports it and file exists
    # This requires the .webp file to exist alongside original
    set $webp_ext "";
    if ($http_accept ~* "image/webp") {
        set $webp_ext ".webp";
    }

    # Try WebP first, fallback to original
    location ~* \.(jpg|jpeg|png|gif)$ {
        add_header Vary "Accept";
        expires 30d;
        add_header Cache-Control "public";
        # Uncomment below to auto-serve WebP (requires webp files to exist):
        # try_files $uri$webp_ext $uri =404;
    }
}

# =====================================================
# Videos: No cache (large files, stream them)
# =====================================================
location /Videos/ {
    expires -1;
    add_header Cache-Control "no-store";
    # Enable range requests for video seeking
    add_header Accept-Ranges bytes;
}

# =====================================================
# API: No cache, CORS
# =====================================================
location /api/ {
    expires -1;
    add_header Cache-Control "no-store, no-cache, must-revalidate";
    proxy_pass http://localhost:4000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_cache_bypass $http_upgrade;
}

# =====================================================
# HTML: No cache (always fresh)
# =====================================================
location ~* \.html$ {
    expires -1;
    add_header Cache-Control "no-store, no-cache, must-revalidate";
    add_header Pragma "no-cache";
}

# =====================================================
# Security headers
# =====================================================
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
