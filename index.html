  <script>
    // Placeholder image (inline SVG data-URI)
    const PLACEHOLDER = 'data:image/svg+xml,' + encodeURIComponent('<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg"><rect width="400" height="300" fill="#F3F4F6"/><g transform="translate(110, 60)"><path d="M160 120L110 60L80 95L30 30L0 120H160Z" fill="#D1D5DB"/><circle cx="130" cy="35" r="20" fill="#D1D5DB"/></g><text x="200" y="220" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="500" fill="#9CA3AF">No Image</text></svg>');

    // Event-driven image error fallback (no polling)
    function fixBrokenImage(img) {
      if (!img || !img.dataset || img.dataset.fixed) return;
      img.dataset.fixed = 'true';
      img.src = PLACEHOLDER;
      img.alt = '';
    }

    document.addEventListener('error', function(e) {
      if (e.target && e.target.tagName === 'IMG') {
        fixBrokenImage(e.target);
      }
    }, true);

    // Register Service Worker on idle to prevent blocking LCP / initial hydration
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        const registerSW = function() {
          navigator.serviceWorker.register('/sw.js').then(function(reg) {
            console.log('[PWA] Service Worker registered:', reg.scope);
          }).catch(function(err) {
            console.log('[PWA] Service Worker registration failed:', err);
          });
        };
        if ('requestIdleCallback' in window) {
          requestIdleCallback(registerSW, { timeout: 3000 });
        } else {
          setTimeout(registerSW, 1500);
        }
      });
    }
  </script>
