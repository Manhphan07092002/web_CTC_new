services:
  # ─── MongoDB (Tối ưu WiredTiger Cache 1.5GB cho RAM 6GB) ─────────
  mongo:
    image: mongo:7
    container_name: ctc_mongo
    restart: unless-stopped
    command: mongod --wiredTigerCacheSizeGB 1.5
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASS:-ctcadmin2024}
      MONGO_INITDB_DATABASE: ctc_web_new
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
      - mongo_config:/data/configdb
    networks:
      - ctc_network
    deploy:
      resources:
        limits:
          memory: 2048M
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ─── App (Express API + Vite static - Max Heap 1GB) ─────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ctc_app
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 4000
      NODE_OPTIONS: "--max-old-space-size=1024"
      MONGO_URI: mongodb://${MONGO_ROOT_USER:-admin}:${MONGO_ROOT_PASS:-ctcadmin2024}@mongo:27017/ctc_web_new?authSource=admin
      SITE_URL: ${SITE_URL:-https://ctcdn.vn}
      FRONTEND_URL: ${FRONTEND_URL:-https://ctcdn.vn}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://ctcdn.vn,http://ctcdn.vn,https://www.ctcdn.vn}
    ports:
      - "4000:4000"
    volumes:
      - uploads_data:/app/uploads
    networks:
      - ctc_network
    deploy:
      resources:
        limits:
          memory: 1536M
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ─── Nginx reverse proxy (Fast Micro-cache & SSL) ───────────────
  nginx:
    image: nginx:alpine
    container_name: ctc_nginx
    restart: unless-stopped
    depends_on:
      - app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./chung chi:/etc/nginx/chung_chi:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /dev/shm:/dev/shm
    networks:
      - ctc_network
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  mongo_data:
  mongo_config:
  uploads_data:

networks:
  ctc_network:
    name: ctc_network
    driver: bridge
