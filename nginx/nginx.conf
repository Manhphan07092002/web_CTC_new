worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # Output buffers – reduce kernel calls
    output_buffers 2 512k;
    postpone_output 1460;

    # Gzip compression (level 6 = good tradeoff speed vs ratio)
    gzip on;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml font/woff2 font/woff application/font-woff2;
    gzip_min_length 1000;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Upstream app
    upstream ctc_app {
        server app:4000;
        keepalive 32;
    }

    # Upstream cho ctc_task_app (chạy cổng 3500)
    upstream ctc_task_app {
        server host.docker.internal:3500;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        # Client max body size (uploads)
        client_max_body_size 20M;

        # ── Proxy all API requests to Express ─────────────────
        location /api/ {
            proxy_pass http://ctc_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 60s;
        }

        # ── Proxy assets (Immutable 1-year Cache + HTTP/2 Push Preload) ──
        location /assets/ {
            proxy_pass http://ctc_app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
            # Hint browser early for CSS to reduce render-blocking impact
            add_header Vary "Accept-Encoding";
        }

        # ── Proxy uploads ──────────────────────────────────────
        location /uploads/ {
            proxy_pass http://ctc_app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            expires 30d;
            add_header Cache-Control "public, max-age=2592000";
        }

        # ── Proxy sitemap / robots ─────────────────────────────
        location ~ ^/(sitemap\.xml|robots\.txt)$ {
            proxy_pass http://ctc_app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # ── Serve everything else from Express (React SPA) ─────
        location / {
            proxy_pass http://ctc_app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # SPA fallback: if upstream 404s, try again (handled by Express)
            proxy_intercept_errors off;
        }
    }

    # ── HTTPS server for ctcdn.vn (SSL Port 443) ─────────────────
    server {
        listen 443 ssl;
        http2 on;
        server_name ctcdn.vn www.ctcdn.vn;

        ssl_certificate     /etc/nginx/chung_chi/ctcdn_vn_cert_inter_root.crt;
        ssl_certificate_key /etc/nginx/chung_chi/ctcdn_vn_private_key.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        client_max_body_size 20M;

        location /api/ {
            proxy_pass http://ctc_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 60s;
        }

        # ── Proxy assets (Immutable 1-year Cache + HTTP/2 Push Preload) ──
        location /assets/ {
            proxy_pass http://ctc_app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header Vary "Accept-Encoding";
        }

        # ── Proxy uploads ──────────────────────────────────────
        location /uploads/ {
            proxy_pass http://ctc_app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            expires 30d;
            add_header Cache-Control "public, max-age=2592000";
        }

        location ~ ^/(sitemap\.xml|robots\.txt|rss\.xml|feed)$ {
            proxy_pass http://ctc_app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location / {
            proxy_pass http://ctc_app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_intercept_errors off;
        }
    }

    # ── HTTP server cho tasks.ctcdn.vn (Port 80) ──────────────────
    server {
        listen 80;
        server_name tasks.ctcdn.vn;

        client_max_body_size 50M;

        location / {
            proxy_pass http://ctc_task_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 120s;
        }
    }

    # ── HTTPS server cho tasks.ctcdn.vn (Port 443 SSL) ────────────
    server {
        listen 443 ssl;
        http2 on;
        server_name tasks.ctcdn.vn;

        ssl_certificate     /etc/nginx/chung_chi/ctcdn_vn_cert_inter_root.crt;
        ssl_certificate_key /etc/nginx/chung_chi/ctcdn_vn_private_key.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        client_max_body_size 50M;

        location / {
            proxy_pass http://ctc_task_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 120s;
        }
    }
}

